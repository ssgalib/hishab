name: tracker
description: "Offline expense tracker with on-device speech + Gemma3 parsing."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  permission_handler: ^11.0.0
  fl_chart: ^1.2.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/hishab-icon.png
  adaptive_icon_background: "#EFE7D2"
  adaptive_icon_foreground: assets/icon-foreground.png
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/tokenizer/
    - assets/hishab-icon.png
  fonts:
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
